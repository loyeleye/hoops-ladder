# Builds the Android app on every push and pull request.
# - Always: a debug APK you can install on your own phone (download it from the run's "Artifacts").
# - When the upload-key secrets exist: a signed release .aab, ready to upload to Google Play.
# Walkthrough: docs/LEARNING.md, step 5.
name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Copies www/ into the Android project and registers plugins.
      - run: npm ci
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hoops-ladder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # The keystore is stored as a base64 secret and written to a temp file only for this run.
      - name: Build signed release bundle
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease
          rm "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: hoops-ladder-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
