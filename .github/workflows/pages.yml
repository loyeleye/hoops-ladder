# Publishes site/ (the privacy policy and a small home page) to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The policy then lives at https://loyeleye.github.io/hoops-ladder/privacy.html
# Walkthrough: docs/LEARNING.md, step 8.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", "www/vision_bundle.mjs", "www/wasm/**", "www/pose_landmarker_lite.task"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # the Move Check Recorder's line-up check uses the app's own pose model and runtime
      - run: mkdir -p site/pose && cp -r www/vision_bundle.mjs www/wasm www/pose_landmarker_lite.task site/pose/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
